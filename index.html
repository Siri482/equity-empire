<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#080810;--surface:#0d0d1a;--card:#111120;--border:#ffffff1a;--purple:#a855f7;--blue:#38bdf8;--green:#34d399;--red:#f87171;--amber:#fbbf24;--font:'Syne',sans-serif;--mono:'JetBrains Mono',monospace}
body{background:var(--bg);color:#fff;font-family:var(--font);min-height:600px;overflow-x:hidden}
.screen{min-height:600px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px;animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes popIn{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes slideDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
@keyframes countPop{0%{transform:scale(0.2);opacity:0}40%{transform:scale(1.3);opacity:1}70%{transform:scale(.95)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.max500{max-width:500px;width:100%}
.max580{max-width:580px;width:100%}
h1.logo{font-size:clamp(42px,9vw,72px);font-weight:800;line-height:.95;letter-spacing:-2px}
h1.logo .eq{color:#38bdf8;text-shadow:0 0 28px #38bdf870}
h1.logo .em{color:#a855f7;text-shadow:0 0 28px #a855f770}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:3px;color:#ffffff60;text-transform:uppercase;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px}
.btn{font-family:var(--font);font-weight:700;border:none;border-radius:12px;padding:13px 24px;cursor:pointer;transition:all .18s;display:block;width:100%;font-size:15px;text-align:center}
.btn-primary{background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;box-shadow:0 0 20px #a855f730}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 0 28px #a855f750}
.btn-primary:disabled{opacity:.45;transform:none;cursor:not-allowed}
.btn-ghost{background:#ffffff08;border:1px solid var(--border);color:#ffffffcc}
.btn-ghost:hover{border-color:#ffffff40;background:#ffffff12}
.btn-big{font-size:17px;padding:16px 28px;border-radius:14px}
.btn-paypal{background:linear-gradient(135deg,#003087,#009cde);color:#fff;text-decoration:none;display:block;text-align:center;padding:15px;border-radius:12px;font-family:var(--font);font-weight:700;font-size:15px;transition:all .18s}
.btn-paypal:hover{transform:translateY(-2px)}
.btn-decision{background:var(--surface);border:1px solid var(--border);color:#fff;width:100%;text-align:left;border-radius:12px;padding:13px 16px;font-size:14px;line-height:1.5;cursor:pointer;font-family:var(--font);transition:all .18s;display:block;margin-bottom:8px}
.btn-decision:hover:not(:disabled){border-color:var(--purple);background:#1a0d2e;transform:translateX(3px)}
.btn-decision:disabled{opacity:.35;cursor:not-allowed;transform:none}
.opt-lbl{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--purple);letter-spacing:2px;margin-bottom:4px;display:block}
.metric-row{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.m-icon{font-size:15px;width:22px;text-align:center;flex-shrink:0}
.m-lbl{font-family:var(--mono);font-size:10px;color:#ffffff60;width:50px;letter-spacing:1px;text-transform:uppercase;flex-shrink:0}
.m-bar{flex:1;height:7px;background:#ffffff0a;border-radius:4px;overflow:hidden}
.m-fill{height:100%;border-radius:4px;transition:width .55s cubic-bezier(.4,0,.2,1)}
.m-val{font-family:var(--mono);font-size:13px;font-weight:700;width:28px;text-align:right;flex-shrink:0}
.m-delta{font-family:var(--mono);font-size:11px;width:34px;text-align:right;flex-shrink:0}
.d-pos{color:var(--green)}.d-neg{color:var(--red)}
.urgent-pill{display:inline-flex;align-items:center;gap:6px;background:#fbbf2418;border:1px solid #fbbf2440;border-radius:8px;padding:4px 12px;font-family:var(--mono);font-size:10px;color:var(--amber);letter-spacing:2px;animation:pulse 1.2s infinite;margin-bottom:12px}
.timer-wrap{display:flex;align-items:center;justify-content:center;position:relative;width:52px;height:52px;flex-shrink:0}
.timer-wrap svg{transform:rotate(-90deg)}
.timer-num{position:absolute;font-family:var(--mono);font-weight:700;font-size:18px;color:var(--amber);line-height:1}
.feedback-box{background:#ffffff08;border:1px solid var(--border);border-radius:12px;padding:18px;animation:fadeIn .3s ease;margin-top:4px}
.score-huge{font-family:var(--mono);font-size:64px;font-weight:700;line-height:1}
.cap-btn{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;text-align:left;transition:all .18s;color:#fff;font-family:var(--font);width:100%;margin-bottom:10px;display:block}
.cap-btn:hover{border-color:#38bdf860;transform:translateY(-1px)}
.cap-btn.sel{border-color:var(--purple);background:#1a0a2e}
.cap-btn h3{font-size:16px;font-weight:700;margin-bottom:3px;color:#fff}
.cap-btn p{font-size:13px;color:#ffffff70}
.ind-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.ind-btn{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 10px;cursor:pointer;text-align:center;transition:all .18s;color:#fff;font-family:var(--font)}
.ind-btn:hover:not(.locked){transform:translateY(-2px);border-color:#ffffff30}
.ind-btn.sel{border-color:var(--purple);background:#1a0a2e}
.ind-btn.locked{opacity:.45;cursor:not-allowed}
.ind-btn .ind-emoji{font-size:28px;margin-bottom:6px}
.ind-btn .ind-name{font-size:13px;font-weight:700}
.ind-btn .ind-tag{font-family:var(--mono);font-size:9px;color:#ffffff50;margin-top:3px;letter-spacing:1px}
.ind-btn .pro-lock{font-family:var(--mono);font-size:9px;color:var(--amber);margin-top:3px;letter-spacing:1px}
.inp{width:100%;background:#ffffff0a;border:1px solid var(--border);border-radius:10px;padding:13px 16px;font-size:15px;font-family:var(--font);color:#fff;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--purple)}
.inp.error{border-color:var(--red);animation:shake .3s ease}
.inp::placeholder{color:#ffffff40}
.lb-row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--border);font-size:14px}
.lb-row:last-child{border-bottom:none}
.lb-rank{font-family:var(--mono);font-size:11px;color:#ffffff50;text-align:center}
.lb-name{color:#fff;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-score{font-family:var(--mono);font-weight:700;color:var(--purple);text-align:right;white-space:nowrap}
.scanlines{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,#00000009 2px,#00000009 4px);z-index:999}
.badge-pill{display:inline-flex;align-items:center;gap:5px;background:#ffffff10;border:1px solid #ffffff20;border-radius:20px;padding:4px 10px;font-size:12px;font-family:var(--mono);color:#fff;margin:3px;animation:popIn .4s ease}
.badge-pill.new{border-color:var(--amber);background:#fbbf2418;color:var(--amber)}
.micro-event{background:#ffffff0a;border:1px solid #fbbf2430;border-radius:10px;padding:12px 14px;margin-bottom:12px;animation:slideDown .35s ease;font-size:14px;color:var(--amber);line-height:1.5}
.history-row{padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.history-row:last-child{border-bottom:none}
.countdown-overlay{position:fixed;inset:0;background:#080810f5;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9998;animation:fadeIn .2s ease}
.countdown-num{font-family:var(--mono);font-weight:700;font-size:120px;color:var(--purple);text-shadow:0 0 60px #a855f780;animation:countPop .6s ease forwards}
.countdown-label{font-family:var(--mono);font-size:13px;letter-spacing:4px;color:#ffffff60;margin-top:16px;text-transform:uppercase}
.popup-overlay{position:fixed;inset:0;background:#00000080;display:flex;align-items:center;justify-content:center;z-index:9997;animation:fadeIn .2s ease}
.popup-box{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:28px;max-width:340px;width:90%;text-align:center;animation:popIn .3s ease}
.popup-box h3{font-size:20px;font-weight:800;margin-bottom:10px;color:#fff}
.popup-box p{font-size:14px;color:#ffffffaa;line-height:1.6;margin-bottom:20px}
.logo-corner{position:absolute;top:18px;left:18px;width:64px;height:64px;animation:logoFloat 3s ease-in-out infinite}
.home-wrapper{position:relative;min-height:600px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px;animation:fadeIn .4s ease}

</style>

function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function clamp(v){return Math.max(0,Math.min(100,Math.round(v)))}
function pickEvents(industry){const pool=ALL_EVENTS[industry]||ALL_EVENTS.tech;const urg=shuffle(pool.filter(e=>e.urgent)).slice(0,2);const norm=shuffle(pool.filter(e=>!e.urgent)).slice(0,4);return shuffle([...norm,...urg]).slice(0,TOTAL)}
function applyFx(m,fx,capId){const rm=capId==='high'?1.3:1;return{cash:clamp(m.cash+(fx.cash||0)),growth:clamp(m.growth+(fx.growth||0)),trust:clamp(m.trust+(fx.trust||0)),risk:clamp(m.risk+Math.round((fx.risk||0)*rm))}}
function score(m){return m.cash+m.growth+m.trust-m.risk}

  if(s<175)return{emoji:'🚀',title:'Scaler',color:'#38bdf8',blurb:'Real momentum built. Investors are taking your calls now.'};
  return{emoji:'👑',title:'Legendary CEO',color:'#a855f7',blurb:'You didn\'t just win — you defined the category.'};
}
function insight(d){
  const icons={cash:{up:'💰',dn:'💸'},growth:{up:'📈',dn:'📉'},trust:{up:'🤝',dn:'💔'},risk:{up:'⚠️',dn:'🛡️'}};
  const lbl={cash:'Cash',growth:'Growth',trust:'Trust',risk:'Risk'};
  const entries=Object.entries(d).filter(([,v])=>v!==0).map(([k,v])=>{const good=k==='risk'?v<0:v>0;return{k,v,good,icon:v>0?icons[k].up:icons[k].dn,label:lbl[k]}});
  if(!entries.length)return'No real movement this round.';
  const pos=entries.filter(e=>e.good),neg=entries.filter(e=>!e.good);
  const fmt=arr=>arr.map(e=>`${e.label} ${e.icon}`).join(', ');
  if(pos.length&&neg.length)return fmt(pos)+' improved — but '+fmt(neg).toLowerCase()+' took a hit';
  if(pos.length)return fmt(pos)+' improved. Clean win.';
  return fmt(neg)+' took a hit. Rough round.';
}

function getAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx}
function playSound(type){
  try{
    const ctx=getAudio(),o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);
    if(type==='tick'){o.frequency.value=880;g.gain.setValueAtTime(.15,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.08);o.start();o.stop(ctx.currentTime+.08)}
    else if(type==='good'){o.type='sine';o.frequency.setValueAtTime(523,ctx.currentTime);o.frequency.setValueAtTime(659,ctx.currentTime+.1);o.frequency.setValueAtTime(784,ctx.currentTime+.2);g.gain.setValueAtTime(.2,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.4);o.start();o.stop(ctx.currentTime+.4)}
    else if(type==='bad'){o.type='sawtooth';o.frequency.setValueAtTime(200,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(80,ctx.currentTime+.3);g.gain.setValueAtTime(.15,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.3);o.start();o.stop(ctx.currentTime+.3)}
    else if(type==='click'){o.frequency.value=440;g.gain.setValueAtTime(.1,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.05);o.start();o.stop(ctx.currentTime+.05)}
    else if(type==='badge'){[523,659,784,1047].forEach((f,i)=>{const oo=ctx.createOscillator(),gg=ctx.createGain();oo.connect(gg);gg.connect(ctx.destination);oo.frequency.value=f;gg.gain.setValueAtTime(.15,ctx.currentTime+i*.1);gg.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+i*.1+.15);oo.start(ctx.currentTime+i*.1);oo.stop(ctx.currentTime+i*.1+.15)})}
    else if(type==='start'){o.type='sine';o.frequency.setValueAtTime(300,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(900,ctx.currentTime+.4);g.gain.setValueAtTime(.25,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.5);o.start();o.stop(ctx.currentTime+.5)}
  }catch(e){}
}

  const ind=INDUSTRIES.find(i=>i.id===G.industry);
  el.innerHTML=`<div class="screen"><div class="max500">
    <div style="text-align:center;margin-bottom:20px">
      <div style="font-size:46px;margin-bottom:8px">${emoji}</div>
      <div class="tag">${ind?ind.emoji+' '+ind.label:''} · ${G.capital.label} · ${G.name}</div>
      <h2 style="font-size:30px;font-weight:800;color:${color};text-shadow:0 0 24px ${color}60;margin-bottom:8px">${title}</h2>
      <p style="font-size:14px;color:#ffffffcc;line-height:1.65">${blurb}</p>
    </div>
    ${G.newBadges.length?`<div style="background:#fbbf2410;border:1px solid #fbbf2430;border-radius:12px;padding:14px;margin-bottom:14px;text-align:center">
      <div class="tag" style="margin-bottom:6px">New Badges Unlocked!</div>
      <div>${G.newBadges.map(b=>`<span class="badge-pill new">${b.emoji} ${b.label}</span>`).join('')}</div>
    </div>`:''}
    <div class="card" style="margin-bottom:12px">${renderMetrics(m,null)}</div>
    <div class="card" style="margin-bottom:12px;text-align:center">
      <div class="tag" style="margin-bottom:6px">Final Score</div>
      <div class="score-huge" style="color:${color};text-shadow:0 0 32px ${color}50">${sc}</div>
      <div style="font-size:11px;color:#ffffff50;margin-top:4px;font-family:var(--mono)">Cash + Growth + Trust − Risk</div>
    </div>

    <!-- Pro upsell on results if not pro -->
    ${!isPro?`<div style="background:linear-gradient(135deg,#1a0a2e,#0d0820);border:1px solid #a855f730;border-radius:14px;padding:16px;margin-bottom:12px;text-align:center">
      <div style="font-size:13px;color:#ffffff80;margin-bottom:8px">Want to play Restaurant & Fashion?</div>
      <button class="btn btn-primary" onclick="G.screen='home';render();setTimeout(()=>openHomeTab('pro'),100)" style="padding:11px 20px;font-size:14px">Unlock Pro — $2.99 →</button>
    </div>`:''}

    <div style="margin-bottom:12px">
      <button style="background:none;border:none;cursor:pointer;color:#ffffff60;letter-spacing:2px;font-size:10px;text-decoration:underline;font-family:var(--mono)" onclick="toggleHistory()">▶ Decision History</button>
      <div id="hist-panel" style="display:none;margin-top:10px;background:#ffffff05;border-radius:10px;padding:10px">${renderHistory()}</div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:8px">
      <button class="btn btn-primary" onclick="playAgain()" style="flex:1">Play Again</button>
      <button class="btn btn-ghost" onclick="shareResult()" style="flex:1">Share 📸</button>
    </div>
  </div></div>`;
}

function decide(i){
  if(G.feedback)return;clearTimer();playSound('click');
  const ev=G.events[G.round];const opt=ev.options[i];
  const nm=applyFx(G.metrics,opt.fx,G.capital.id);
  const dv={cash:nm.cash-G.metrics.cash,growth:nm.growth-G.metrics.growth,trust:nm.trust-G.metrics.trust,risk:nm.risk-G.metrics.risk};
  G.metrics=nm;G.deltas=dv;G.history.push({round:G.round+1,event:ev.title,choice:opt.label,deltas:dv});
  if(ev.urgent)G.urgentSurvived++;
  Object.values(nm).forEach(v=>{if(v<G.minMetric)G.minMetric=v});if(nm.risk>G.maxRisk)G.maxRisk=nm.risk;
  const hasGood=Object.entries(dv).some(([k,v])=>k==='risk'?v<0:v>0);
  G.feedback={text:opt.label,insight:insight(dv)};G.timerActive=false;
  playSound(hasGood?'good':'bad');
  if(G.round<TOTAL-1&&Math.random()<0.4)G.microEvent=MICRO_EVENTS[Math.floor(Math.random()*MICRO_EVENTS.length)];else G.microEvent=null;
  render();
}
function nextRound(){
  if(G.microEvent){const nm=applyFx(G.metrics,G.microEvent.fx,G.capital.id);Object.values(nm).forEach(v=>{if(v<G.minMetric)G.minMetric=v});if(nm.risk>G.maxRisk)G.maxRisk=nm.risk;G.metrics=nm;}
  G.round++;G.feedback=null;G.deltas={};G.microEvent=null;
  if(G.round>=TOTAL){
    G.finalScore=score(G.metrics);
    // Track total plays
    try{const p=parseInt(localStorage.getItem('ee_total_plays')||'0');localStorage.setItem('ee_total_plays',p+1)}catch(e){}
    const ind=INDUSTRIES.find(i=>i.id===G.industry);
    saveGlobalLb({name:G.name.trim()||'Anonymous',score:G.finalScore,industry:ind?ind.emoji+' '+ind.label:'Tech',capital:G.capital.label,ts:Date.now()});
    G.newBadges=checkBadges();if(G.newBadges.length)playSound('badge');
    G.screen='results';render();return;
  }
  render();if(G.events[G.round].urgent)startTimer();
}
function toggleHistory(){const p=document.getElementById('hist-panel');if(p)p.style.display=p.style.display==='none'?'block':'none'}
function renderHistory(){
  if(!G.history.length)return'<p style="color:#ffffff50;font-size:13px">No decisions recorded.</p>';
  return G.history.map(h=>`<div class="history-row">
    <div style="font-family:var(--mono);font-size:10px;color:#ffffff50;margin-bottom:3px">ROUND ${h.round} · ${h.event}</div>
    <div style="font-size:13px;color:#ffffffcc;margin-bottom:4px">${h.choice}</div>
    <div style="font-family:var(--mono);font-size:11px">${Object.entries(h.deltas).filter(([,v])=>v!==0).map(([k,v])=>`<span style="color:${v>0&&k!=='risk'||v<0&&k==='risk'?'#34d399':'#f87171'}">${k} ${v>0?'+'+v:v}</span>`).join(' ')}</div>
  </div>`).join('');
}
function renderBadges(){
  return`<div class="card" style="text-align:left">
    <div class="tag" style="margin-bottom:10px">Achievement Badges · ${earnedBadges.size} / ${BADGES.length}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      ${BADGES.map(b=>{const earned=earnedBadges.has(b.id);return`<div style="background:${earned?'#ffffff0f':'#ffffff05'};border:1px solid ${earned?'#ffffff25':'#ffffff10'};border-radius:10px;padding:12px;opacity:${earned?1:.5}">
        <div style="font-size:22px;margin-bottom:5px">${b.emoji}</div>
        <div style="font-size:13px;font-weight:700;color:${earned?'#fff':'#ffffff80'}">${b.label}</div>
        <div style="font-size:11px;color:#ffffff60;margin-top:2px">${b.desc}</div>
        ${earned?'<div style="font-family:var(--mono);font-size:10px;color:var(--green);margin-top:4px">✓ EARNED</div>':''}
      </div>`}).join('')}
    </div>
  </div>`;
}
function renderPro(){
  if(isPro)return`<div class="card" style="text-align:center"><div style="font-size:40px;margin-bottom:10px">✦</div><h2 style="font-size:22px;font-weight:800;color:var(--purple);margin-bottom:8px">You're Pro!</h2><p style="font-size:14px;color:#ffffffaa;line-height:1.6">All industries unlocked. Restaurant 🍽️ and Fashion 👗 are ready.</p></div>`;
  return`<div class="card" style="text-align:left">
    <div class="tag" style="margin-bottom:6px">Upgrade</div>
    <h2 style="font-size:22px;font-weight:800;margin-bottom:6px;color:#fff">Equity Empire <span style="color:var(--purple)">Pro</span></h2>
    <p style="font-size:14px;color:#ffffffaa;margin-bottom:14px;line-height:1.65">One-time unlock · yours forever.</p>
    <ul style="margin-bottom:16px;display:flex;flex-direction:column;gap:9px;list-style:none">
      ${['🍽️ Restaurant industry — 8 unique scenarios','👗 Fashion industry — 8 unique scenarios','⚡ Emergency Retry — second chance','🎯 Early access to new expansions'].map(f=>`<li style="display:flex;gap:10px;font-size:14px;color:#ffffffcc"><span style="color:var(--purple)">✦</span>${f}</li>`).join('')}
    </ul>
    <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:14px">
      <span style="font-family:var(--mono);font-size:36px;font-weight:700;color:#fff">$2.99</span>
      <span style="font-family:var(--mono);font-size:12px;color:#ffffff60">USD · one-time</span>
    </div>
    <a href="https://paypal.me/irissilva680/2.99" target="_blank" class="btn-paypal" style="margin-bottom:12px">💙 Pay $2.99 via PayPal → Get Unlock Code</a>
    <div class="tag" style="margin-bottom:6px">Already paid? Enter your code:</div>
    <div style="display:flex;gap:8px">
      <input class="inp" id="procode" placeholder="Enter unlock code..." style="flex:1;text-transform:uppercase" maxlength="20">
      <button class="btn btn-primary" onclick="redeemCode()" style="width:auto;padding:12px 18px;flex-shrink:0">Unlock</button>
    </div>
    <div id="code-msg" style="margin-top:8px;font-family:var(--mono);font-size:12px"></div>
    <div style="margin-top:12px;font-family:var(--mono);font-size:10px;color:#ffffff40;text-align:center;letter-spacing:2px">SECURE · POWERED BY PAYPAL</div>
  </div>`;
}
function redeemCode(){
  const inp=document.getElementById('procode'),msg=document.getElementById('code-msg');if(!inp||!msg)return;
  if(inp.value.trim().toUpperCase()===PRO_CODE){isPro=true;try{localStorage.setItem('ee_pro','1')}catch(e){}playSound('badge');msg.style.color='var(--green)';msg.textContent='✓ Pro unlocked! Restaurant & Fashion are now playable.';setTimeout(()=>{G.screen='setup';render()},1500)}
  else{msg.style.color='var(--red)';msg.textContent='✗ Invalid code. Check your PayPal receipt.';playSound('bad')}
}
function generateShareImage(){
  const canvas=document.getElementById('shareCanvas');canvas.width=600;canvas.height=340;
  const ctx=canvas.getContext('2d');ctx.fillStyle='#080810';ctx.fillRect(0,0,600,340);
  ctx.strokeStyle='#ffffff06';ctx.lineWidth=1;for(let y=0;y<340;y+=20){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(600,y);ctx.stroke()}
  ctx.fillStyle='#38bdf8';ctx.font='bold 26px sans-serif';ctx.fillText('Equity',30,55);
  ctx.fillStyle='#a855f7';ctx.font='bold 26px sans-serif';ctx.fillText('Empire',108,55);
  const ind=INDUSTRIES.find(i=>i.id===G.industry);
  ctx.fillStyle='#ffffff40';ctx.font='12px monospace';ctx.fillText((ind?ind.emoji+' '+ind.label:'Tech')+' · '+G.capital.label+' · '+G.name,30,78);
  const{emoji,title,color}=titleInfo(G.finalScore);
  ctx.fillStyle=color;ctx.font='bold 20px sans-serif';ctx.fillText(emoji+' '+title,30,110);
  ctx.fillStyle='#ffffff40';ctx.font='11px monospace';ctx.fillText('SCORE',30,142);
  ctx.fillStyle=color;ctx.font='bold 46px monospace';ctx.fillText(G.finalScore,30,190);
  const keys=['cash','growth','trust','risk'];const mColors={cash:'#38bdf8',growth:'#a855f7',trust:'#34d399',risk:'#f87171'};
  keys.forEach((k,i)=>{const x=320,y=68+i*55,w=220,h=8,val=G.metrics[k];ctx.fillStyle='#ffffff10';ctx.fillRect(x,y,w,h);ctx.fillStyle=mColors[k];ctx.fillRect(x,y,w*val/100,h);ctx.fillStyle='#ffffff70';ctx.font='10px monospace';ctx.fillText(k.toUpperCase(),x,y-5);ctx.fillStyle='#fff';ctx.font='bold 12px monospace';ctx.fillText(val,x+w+8,y+8)});
  if(earnedBadges.size>0){const bArr=[...earnedBadges].map(id=>BADGES.find(b=>b.id===id)).filter(Boolean);ctx.fillStyle='#ffffff40';ctx.font='10px monospace';ctx.fillText('BADGES',30,228);bArr.slice(0,6).forEach((b,i)=>{ctx.font='17px sans-serif';ctx.fillText(b.emoji,30+i*34,254)})}
  ctx.fillStyle='#ffffff50';ctx.font='13px sans-serif';ctx.fillText('Can you beat me? 😏',30,292);
  ctx.fillStyle='#ffffff30';ctx.font='11px monospace';ctx.fillText('EQUITY EMPIRE · Business Simulation',30,318);
  return canvas.toDataURL('image/png');
}
function shareResult(){
  playSound('click');const dataUrl=generateShareImage();
  const link=document.createElement('a');link.download='equity-empire-result.png';link.href=dataUrl;link.click();
  const toast=document.createElement('div');
  toast.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#34d399;color:#000;padding:10px 20px;border-radius:10px;font-family:Syne,sans-serif;font-weight:700;font-size:14px;z-index:9999;animation:fadeIn .3s ease';
  toast.textContent='Image saved! Share it 🎉';document.body.appendChild(toast);setTimeout(()=>toast.remove(),3000);
}
function playAgain(){
  clearTimer();
  G={screen:'setup',name:G.name,capital:G.capital,industry:G.industry,metrics:{},events:[],round:0,
    feedback:null,deltas:{},timerVal:TIMER_SECS,timerActive:false,_timer:null,
    history:[],microEvent:null,newBadges:[],urgentSurvived:0,minMetric:100,maxRisk:0,finalScore:0};
  render();
}
render();
</script>
